spring.application.name=estik

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

jwt.secret=${SECRET_KEY:secret-key-random-for-development-only-please-change-it}
jwt.issuer=estik

jwt.expiration-time=15m
jwt.refresh-token-expiration-time=7d

spring.jpa.open-in-view=false

storage.chat.dir=uploads/chat
storage.signing-secret=${STORAGE_SIGNING_SECRET:uma-chave-aleatoria-muito-foda-do-balacobaco}
storage.signed-url.ttl=1h

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB