name: estik

services:
  postgres:
    image: postgres:17-alpine
    container_name: estik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - estik-net
  
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    image: estik-backend:latest
    container_name: estik-backend
    restart: unless-stopped
    depends_on:
      postgres:
          condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET}
      TZ: ${TZ}
    ports:
      - "8080:8080"
    volumes:
      - estik_uploads:/app/uploads
    networks:
      - estik-net
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: estik-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - estik-net
  
  backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: estik-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --schema=public --blobs"
      SCHEDULE: ${BACKUP_SCHEDULE}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS}
      TZ: ${TZ}
    volumes:
      - ./backups:/backups
    networks:
      - estik-net
  
volumes:
  postgres_data:
  pgadmin_data:
  estik_uploads:

networks:
  estik-net:
    driver: bridge
